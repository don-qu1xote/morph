name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  linux:
    name: "Linux: формат, сборка, тесты, tidy"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # формат и tidy сверяются с коммитом upstream из .upstream, нужна вся история
          fetch-depth: 0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Образ среды сборки
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          tags: morph-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: make ci
        run: make docker-ci

  macos:
    name: "macOS: сборка, тесты, dmg"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Qt
        run: brew install qt

      - name: Сборка и тесты
        run: make test BUILD_DIR=build-release BUILD_TYPE=Release

      - name: dmg
        run: make dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: morph-macos
          path: build-release/morph.dmg
          retention-days: 14
